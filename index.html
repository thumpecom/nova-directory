<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova Directory</title>
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #14141a;
    --panel-2: #1c1c24;
    --border: #2a2a36;
    --text: #f1f1f3;
    --muted: #8a8a99;
    --accent: #6f8cff;
    --accent-hover: #8aa1ff;
    --yellow: #f5c542;
    --yellow-bg: #3a2f0a;
    --green: #4ade80;
    --green-bg: #103a22;
    --red: #ef4444;
    --red-bg: #3a1010;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select {
    font-family: inherit;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
  }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }

  /* Login */
  .login-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .login-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }
  .login-card h1 { margin: 0 0 4px; font-size: 22px; }
  .login-card p { margin: 0 0 20px; color: var(--muted); }
  .login-card input { width: 100%; }
  .login-card button {
    margin-top: 12px;
    width: 100%;
    padding: 10px 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-weight: 600;
  }
  .login-card button:hover { background: var(--accent-hover); }
  .login-error { color: var(--red); margin-top: 10px; font-size: 13px; min-height: 18px; }

  /* App */
  .app-shell { max-width: 1200px; margin: 0 auto; padding: 24px; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: 0.5px; }
  .brand span { color: var(--muted); font-weight: 500; }
  .logout-btn {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 13px;
  }
  .logout-btn:hover { color: var(--text); border-color: var(--muted); }

  .store-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .store-tab {
    background: transparent;
    color: var(--muted);
    border: none;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .store-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .store-tab:hover { color: var(--text); }

  .sub-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 20px;
  }
  .sub-tab {
    background: var(--panel);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 13px;
    font-weight: 500;
  }
  .sub-tab.active { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
  .sub-tab:hover { color: var(--text); }

  .section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .section-title { font-weight: 600; font-size: 15px; }
  .section-body { padding: 12px 18px; }

  .row-list { display: flex; flex-direction: column; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .row .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .row .row-label { font-weight: 500; }
  .row .row-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12.5px;
    color: var(--muted);
    word-break: break-all;
  }
  .row .row-url a { color: var(--muted); }
  .row .row-url a:hover { color: var(--accent); }
  .row-actions { display: flex; gap: 6px; flex-shrink: 0; }

  .empty { color: var(--muted); font-style: italic; padding: 8px 0; }

  /* Buttons */
  .btn {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 500;
  }
  .btn:hover { border-color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--border);
  }
  .btn-danger:hover { border-color: var(--danger); background: var(--red-bg); }
  .btn-sm { padding: 4px 9px; font-size: 12px; }

  .redirect-badge {
    background: var(--yellow-bg);
    color: var(--yellow);
    border: 1px solid var(--yellow);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .redirect-badge:hover { background: var(--yellow); color: #2a1f00; }

  /* Add forms */
  .add-form {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }
  .add-form input, .add-form select { flex: 1; min-width: 140px; }
  .add-form .add-form-actions { display: flex; gap: 6px; }

  /* Ad accounts table */
  table.ad-table { width: 100%; border-collapse: collapse; }
  table.ad-table th, table.ad-table td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.ad-table th {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--panel-2);
  }
  table.ad-table td input,
  table.ad-table td textarea,
  table.ad-table td select { width: 100%; }
  .col-name { width: 28%; }
  .col-status { width: 130px; }
  .col-notes { width: auto; }
  .col-actions { width: 90px; text-align: right; }
  .status-active { color: var(--green); }
  .status-disabled { color: var(--red); }
  select.status-select {
    border-left: 4px solid transparent;
    font-weight: 600;
  }
  select.status-select.active { border-left-color: var(--green); color: var(--green); }
  select.status-select.disabled { border-left-color: var(--red); color: var(--red); }

  /* Page row notes */
  .row .row-notes {
    font-size: 12.5px;
    color: var(--muted);
    font-style: italic;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .row .row-notes::before {
    content: "📝 ";
    font-style: normal;
    margin-right: 2px;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 50;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 500px;
    overflow: hidden;
  }
  .modal-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-header h3 { margin: 0; font-size: 15px; }
  .modal-close {
    background: transparent;
    color: var(--muted);
    border: none;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
  }
  .modal-body { padding: 18px; }

  .chain-flow { display: flex; flex-direction: column; gap: 0; }
  .chain-step {
    padding: 10px 12px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .chain-step .chain-label { font-weight: 600; font-size: 13px; }
  .chain-step .chain-url {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
  }
  .chain-step.current { border-color: var(--accent); background: rgba(111, 140, 255, 0.08); }
  .chain-arrow {
    text-align: center;
    color: var(--yellow);
    font-size: 16px;
    margin: 2px 0 4px;
  }
  .chain-end {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
    margin-top: 4px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    z-index: 100;
    max-width: 360px;
  }
  .toast.error { border-left-color: var(--red); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-view" class="login-wrap">
  <div class="login-card">
    <h1>Nova Directory</h1>
    <p>Enter the team password to continue.</p>
    <form id="login-form">
      <input id="login-password" type="password" placeholder="Password" autofocus />
      <button type="submit">Sign in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app-view" class="hidden">
  <div class="app-shell">
    <div class="topbar">
      <div class="brand">NOVA <span>· Directory</span></div>
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>

    <div class="store-tabs" id="store-tabs">
      <button class="store-tab" data-store="NovaPaw">NovaPaw</button>
      <button class="store-tab" data-store="NovaLift">NovaLift</button>
      <button class="store-tab" data-store="NovaPod">NovaPod</button>
    </div>

    <div class="sub-tabs" id="sub-tabs">
      <button class="sub-tab" data-sub="pages">Pages</button>
      <button class="sub-tab" data-sub="ad-accounts">Ad Accounts</button>
    </div>

    <div id="tab-content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
// ============================================================
// State
// ============================================================
const state = {
  store: 'NovaPaw',
  sub: 'pages',
  pages: [],       // current store pages
  redirects: [],   // current store redirects (with joined page info)
  adAccounts: [],
};

// ============================================================
// API
// ============================================================
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opts,
  });
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const msg = (data && data.error) || `Request failed (${res.status})`;
    throw new Error(msg);
  }
  return data;
}

// ============================================================
// Auth
// ============================================================
async function checkAuth() {
  try {
    const { authed } = await api('/api/auth/me');
    return authed;
  } catch { return false; }
}

async function login(password) {
  await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ password }) });
}

async function logout() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch {}
  showLogin();
}

function showLogin() {
  document.getElementById('app-view').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
  document.getElementById('login-password').value = '';
  setTimeout(() => document.getElementById('login-password').focus(), 0);
}

function showApp() {
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('app-view').classList.remove('hidden');
  selectStore(state.store);
}

// ============================================================
// Toast / errors
// ============================================================
function toast(msg, kind = 'info') {
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast' + (kind === 'error' ? ' error' : '');
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function handleErr(e) {
  console.error(e);
  toast(e.message || 'Something went wrong', 'error');
}

// ============================================================
// Modal
// ============================================================
function openModal(title, bodyHTML, onMount) {
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal">
        <div class="modal-header">
          <h3>${escapeHTML(title)}</h3>
          <button class="modal-close" id="modal-close">×</button>
        </div>
        <div class="modal-body">${bodyHTML}</div>
      </div>
    </div>
  `;
  document.getElementById('modal-close').onclick = closeModal;
  document.getElementById('modal-backdrop').onclick = (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  };
  if (typeof onMount === 'function') onMount();
}
function closeModal() {
  document.getElementById('modal-root').innerHTML = '';
}

// ============================================================
// Helpers
// ============================================================
function escapeHTML(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function findPage(id) {
  return state.pages.find(p => p.id === id);
}

// Build a map: source_page_id -> destination_page_id (current store).
function buildRedirectMap() {
  const m = new Map();
  for (const r of state.redirects) m.set(r.source_page_id, r);
  return m;
}

// Walk forward from a starting page id; returns array of page ids in order.
function chainFrom(pageId) {
  const m = buildRedirectMap();
  const visited = new Set([pageId]);
  const chain = [pageId];
  let cur = pageId;
  while (m.has(cur)) {
    const next = m.get(cur).destination_page_id;
    if (visited.has(next)) break;
    visited.add(next);
    chain.push(next);
    cur = next;
  }
  return chain;
}

// ============================================================
// Tabs
// ============================================================
function selectStore(store) {
  state.store = store;
  document.querySelectorAll('.store-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.store === store);
  });
  selectSub(state.sub);
}

function selectSub(sub) {
  state.sub = sub;
  document.querySelectorAll('.sub-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.sub === sub);
  });
  renderTab();
}

async function renderTab() {
  const root = document.getElementById('tab-content');
  root.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    if (state.sub === 'pages') {
      await loadPagesAndRedirects();
      renderPagesTab(root);
    } else if (state.sub === 'ad-accounts') {
      await loadAdAccounts();
      renderAdAccountsTab(root);
    }
  } catch (e) { handleErr(e); root.innerHTML = `<div class="empty">Failed to load.</div>`; }
}

// ============================================================
// PAGES + REDIRECTS
// ============================================================
async function loadPagesAndRedirects() {
  const [pagesRes, redirectsRes] = await Promise.all([
    api(`/api/pages?store=${encodeURIComponent(state.store)}`),
    api(`/api/redirects?store=${encodeURIComponent(state.store)}`),
  ]);
  state.pages = pagesRes.pages || [];
  state.redirects = redirectsRes.redirects || [];
}

function renderPagesTab(root) {
  const prelanders = state.pages.filter(p => p.page_type === 'prelander');
  const pdps = state.pages.filter(p => p.page_type === 'pdp');
  const redirectMap = buildRedirectMap();

  root.innerHTML = `
    ${renderPageSection('Prelanders', 'prelander', prelanders, redirectMap)}
    ${renderPageSection('PDPs', 'pdp', pdps, redirectMap)}
    ${renderRedirectsSection()}
  `;

  // wire add forms
  ['prelander', 'pdp'].forEach(type => {
    const form = document.getElementById(`add-page-form-${type}`);
    if (!form) return;
    form.onsubmit = async (e) => {
      e.preventDefault();
      const label = form.querySelector('[name=label]').value.trim();
      const url = form.querySelector('[name=url]').value.trim();
      if (!label && !url) return;
      try {
        await api('/api/pages', {
          method: 'POST',
          body: JSON.stringify({ store: state.store, page_type: type, label, url }),
        });
        await loadPagesAndRedirects();
        renderPagesTab(root);
      } catch (e) { handleErr(e); }
    };
  });

  // wire redirect badges
  root.querySelectorAll('[data-redirect-source]').forEach(btn => {
    btn.onclick = () => openChainModal(btn.dataset.redirectSource);
  });

  // wire edit / delete
  root.querySelectorAll('[data-edit-page]').forEach(btn => {
    btn.onclick = () => openEditPageModal(btn.dataset.editPage);
  });
  root.querySelectorAll('[data-delete-page]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.deletePage;
      const p = findPage(id);
      if (!confirm(`Delete "${p?.label || p?.url || 'this page'}"? This also removes any redirects involving it.`)) return;
      try {
        await api(`/api/pages/${id}`, { method: 'DELETE' });
        await loadPagesAndRedirects();
        renderPagesTab(root);
      } catch (e) { handleErr(e); }
    };
  });

  // wire add redirect
  const addRedirectForm = document.getElementById('add-redirect-form');
  if (addRedirectForm) {
    addRedirectForm.onsubmit = async (e) => {
      e.preventDefault();
      const source = addRedirectForm.querySelector('[name=source]').value;
      const dest = addRedirectForm.querySelector('[name=dest]').value;
      if (!source || !dest) { toast('Pick both source and destination.', 'error'); return; }
      try {
        await api('/api/redirects', {
          method: 'POST',
          body: JSON.stringify({ source_page_id: source, destination_page_id: dest }),
        });
        await loadPagesAndRedirects();
        renderPagesTab(root);
      } catch (e) { handleErr(e); }
    };
  }

  // wire delete redirect
  root.querySelectorAll('[data-delete-redirect]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.deleteRedirect;
      if (!confirm('Remove this redirect?')) return;
      try {
        await api(`/api/redirects/${id}`, { method: 'DELETE' });
        await loadPagesAndRedirects();
        renderPagesTab(root);
      } catch (e) { handleErr(e); }
    };
  });
}

function renderPageSection(title, type, items, redirectMap) {
  const rows = items.map(p => {
    const r = redirectMap.get(p.id);
    const urlDisplay = p.url
      ? `<div class="row-url"><a href="${escapeHTML(p.url)}" target="_blank" rel="noopener">${escapeHTML(p.url)}</a></div>`
      : `<div class="row-url" style="color:#5a5a6a;">(no URL)</div>`;
    const badge = r
      ? `<button class="redirect-badge" data-redirect-source="${p.id}" title="Click to see full redirect chain">Redirecting →</button>`
      : '';
    const notesDisplay = p.notes
      ? `<div class="row-notes">${escapeHTML(p.notes)}</div>`
      : '';
    return `
      <div class="row">
        <div class="row-main">
          <div class="row-label">${escapeHTML(p.label || '(unlabeled)')}</div>
          ${urlDisplay}
          ${notesDisplay}
        </div>
        ${badge}
        <div class="row-actions">
          <button class="btn btn-sm" data-edit-page="${p.id}">Edit</button>
          <button class="btn btn-sm btn-danger" data-delete-page="${p.id}">Delete</button>
        </div>
      </div>
    `;
  }).join('');

  const empty = items.length === 0 ? `<div class="empty">No ${title.toLowerCase()} yet.</div>` : '';

  return `
    <div class="section">
      <div class="section-header">
        <div class="section-title">${title}</div>
      </div>
      <div class="section-body">
        <div class="row-list">${rows}${empty}</div>
        <form class="add-form" id="add-page-form-${type}">
          <input name="label" placeholder="Label (e.g. T-ugc-1-pad14days)" />
          <input name="url" placeholder="URL" />
          <div class="add-form-actions">
            <button type="submit" class="btn btn-primary">Add ${type === 'prelander' ? 'Prelander' : 'PDP'}</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function renderRedirectsSection() {
  if (state.pages.length === 0) {
    return `
      <div class="section">
        <div class="section-header"><div class="section-title">Current Redirects</div></div>
        <div class="section-body"><div class="empty">Add pages above before creating redirects.</div></div>
      </div>
    `;
  }

  const sourceOpts = state.pages.map(p =>
    `<option value="${p.id}">${escapeHTML(p.label || p.url || '(unlabeled)')} [${p.page_type}]</option>`
  ).join('');
  const destOpts = sourceOpts;

  const items = state.redirects.map(r => `
    <div class="row">
      <div class="row-main">
        <div class="row-label">
          ${escapeHTML(r.source_label || r.source_url || '(unlabeled)')}
          <span style="color: var(--yellow); margin: 0 6px;">→</span>
          ${escapeHTML(r.dest_label || r.dest_url || '(unlabeled)')}
        </div>
        <div class="row-url">
          ${escapeHTML(r.source_url || '')} → ${escapeHTML(r.dest_url || '')}
        </div>
      </div>
      <button class="redirect-badge" data-redirect-source="${r.source_page_id}">View chain</button>
      <div class="row-actions">
        <button class="btn btn-sm btn-danger" data-delete-redirect="${r.id}">Remove</button>
      </div>
    </div>
  `).join('');

  const empty = state.redirects.length === 0 ? `<div class="empty">No redirects yet.</div>` : '';

  return `
    <div class="section">
      <div class="section-header"><div class="section-title">Current Redirects</div></div>
      <div class="section-body">
        <div class="row-list">${items}${empty}</div>
        <form class="add-form" id="add-redirect-form">
          <select name="source"><option value="">From page…</option>${sourceOpts}</select>
          <select name="dest"><option value="">To page…</option>${destOpts}</select>
          <div class="add-form-actions">
            <button type="submit" class="btn btn-primary">Add redirect</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

function openEditPageModal(id) {
  const p = findPage(id);
  if (!p) return;
  openModal(`Edit ${p.page_type === 'prelander' ? 'prelander' : 'PDP'}`, `
    <form id="edit-page-form">
      <div style="margin-bottom: 10px;">
        <label style="display:block; color: var(--muted); font-size:12px; margin-bottom:4px;">Label</label>
        <input name="label" value="${escapeHTML(p.label)}" style="width:100%;" />
      </div>
      <div style="margin-bottom: 10px;">
        <label style="display:block; color: var(--muted); font-size:12px; margin-bottom:4px;">URL</label>
        <input name="url" value="${escapeHTML(p.url)}" style="width:100%;" />
      </div>
      <div style="margin-bottom: 14px;">
        <label style="display:block; color: var(--muted); font-size:12px; margin-bottom:4px;">Notes (optional)</label>
        <textarea name="notes" rows="3" style="width:100%;" placeholder="Free-form notes about this page">${escapeHTML(p.notes || '')}</textarea>
      </div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <button type="button" class="btn" id="edit-page-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  `, () => {
    document.getElementById('edit-page-cancel').onclick = closeModal;
    document.getElementById('edit-page-form').onsubmit = async (e) => {
      e.preventDefault();
      const form = e.currentTarget;
      const label = form.querySelector('[name=label]').value.trim();
      const url = form.querySelector('[name=url]').value.trim();
      const notes = form.querySelector('[name=notes]').value;
      try {
        await api(`/api/pages/${id}`, { method: 'PATCH', body: JSON.stringify({ label, url, notes }) });
        closeModal();
        await loadPagesAndRedirects();
        renderPagesTab(document.getElementById('tab-content'));
      } catch (e) { handleErr(e); }
    };
  });
}

function openChainModal(startId) {
  const chain = chainFrom(startId);
  const steps = chain.map((id, idx) => {
    const p = findPage(id);
    if (!p) return '';
    const isCurrent = idx === 0;
    const stepHTML = `
      <div class="chain-step${isCurrent ? ' current' : ''}">
        <div class="chain-label">${escapeHTML(p.label || '(unlabeled)')} ${isCurrent ? '<span style="color: var(--accent); font-size: 11px; margin-left: 6px;">START</span>' : ''}</div>
        <div class="chain-url">${escapeHTML(p.url || '')}</div>
      </div>
    `;
    const arrow = idx < chain.length - 1 ? '<div class="chain-arrow">↓</div>' : '';
    return stepHTML + arrow;
  }).join('');

  const endNote = chain.length === 1
    ? '<div class="chain-end">This page has no outgoing redirect.</div>'
    : `<div class="chain-end">Chain ends at the page above (no further redirect).</div>`;

  openModal('Redirect chain', `<div class="chain-flow">${steps}${endNote}</div>`);
}

// ============================================================
// AD ACCOUNTS
// ============================================================
async function loadAdAccounts() {
  const res = await api(`/api/ad-accounts?store=${encodeURIComponent(state.store)}`);
  state.adAccounts = res.accounts || [];
}

function renderAdAccountsTab(root) {
  const rows = state.adAccounts.map(a => `
    <tr data-account-id="${a.id}">
      <td class="col-name"><input type="text" data-field="name" value="${escapeHTML(a.name)}" /></td>
      <td class="col-status">
        <select class="status-select ${a.status}" data-field="status">
          <option value="active" ${a.status === 'active' ? 'selected' : ''}>● Active</option>
          <option value="disabled" ${a.status === 'disabled' ? 'selected' : ''}>● Disabled</option>
        </select>
      </td>
      <td class="col-notes"><textarea data-field="notes" rows="1">${escapeHTML(a.notes)}</textarea></td>
      <td class="col-actions"><button class="btn btn-sm btn-danger" data-delete-account="${a.id}">Delete</button></td>
    </tr>
  `).join('');

  root.innerHTML = `
    <div class="section">
      <div class="section-header"><div class="section-title">Ad Accounts</div></div>
      <div class="section-body" style="padding: 0;">
        <table class="ad-table">
          <thead>
            <tr>
              <th class="col-name">Name</th>
              <th class="col-status">Status</th>
              <th class="col-notes">Notes</th>
              <th class="col-actions"></th>
            </tr>
          </thead>
          <tbody id="ad-tbody">${rows || `<tr><td colspan="4" class="empty" style="padding: 14px 12px;">No ad accounts yet.</td></tr>`}</tbody>
        </table>
        <div style="padding: 14px 18px; border-top: 1px solid var(--border);">
          <form class="add-form" id="add-account-form" style="margin: 0;">
            <input name="name" placeholder="Ad account name" />
            <select name="status">
              <option value="active">● Active</option>
              <option value="disabled">● Disabled</option>
            </select>
            <input name="notes" placeholder="Notes (e.g. main launches acc, dupes)" style="flex: 2;" />
            <div class="add-form-actions">
              <button type="submit" class="btn btn-primary">Add account</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  `;

  // wire add
  document.getElementById('add-account-form').onsubmit = async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const name = form.querySelector('[name=name]').value.trim();
    const status = form.querySelector('[name=status]').value;
    const notes = form.querySelector('[name=notes]').value;
    if (!name) { toast('Name is required.', 'error'); return; }
    try {
      await api('/api/ad-accounts', {
        method: 'POST',
        body: JSON.stringify({ store: state.store, name, status, notes }),
      });
      await loadAdAccounts();
      renderAdAccountsTab(root);
    } catch (e) { handleErr(e); }
  };

  // wire inline edits (debounced save on blur/change)
  document.querySelectorAll('tr[data-account-id]').forEach(tr => {
    const id = tr.dataset.accountId;
    tr.querySelectorAll('[data-field]').forEach(el => {
      const save = async () => {
        const field = el.dataset.field;
        const value = el.value;
        try {
          await api(`/api/ad-accounts/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ [field]: value }),
          });
          if (field === 'status') {
            el.classList.remove('active', 'disabled');
            el.classList.add(value);
          }
        } catch (e) { handleErr(e); }
      };
      if (el.tagName === 'SELECT') el.onchange = save;
      else { el.onblur = save; el.onkeydown = (ev) => { if (ev.key === 'Enter' && el.tagName === 'INPUT') el.blur(); }; }
    });
    tr.querySelector('[data-delete-account]').onclick = async () => {
      if (!confirm('Delete this ad account?')) return;
      try {
        await api(`/api/ad-accounts/${id}`, { method: 'DELETE' });
        await loadAdAccounts();
        renderAdAccountsTab(root);
      } catch (e) { handleErr(e); }
    };
  });
}

// ============================================================
// Wire top-level events
// ============================================================
document.getElementById('login-form').onsubmit = async (e) => {
  e.preventDefault();
  const pwd = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.textContent = '';
  try {
    await login(pwd);
    showApp();
  } catch (e) {
    err.textContent = e.message || 'Login failed';
  }
};

document.getElementById('logout-btn').onclick = logout;

document.getElementById('store-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.store-tab');
  if (btn) selectStore(btn.dataset.store);
});
document.getElementById('sub-tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.sub-tab');
  if (btn) selectSub(btn.dataset.sub);
});

// ============================================================
// Boot
// ============================================================
(async () => {
  const authed = await checkAuth();
  if (authed) showApp();
  else showLogin();
})();
</script>
